[project]
name = "agentic-ems"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic==2.8.0",
    "duckdb==2.0.0",
    "langchain-anthropic==1.7.10",
    "langchain-core==1.8.0",
    "langfuse==5.2.0",
    "langgraph==1.2.20",
    "mcp==2.3.0",
    "pydantic==2.14.3",
    "pytz==2026.6",
    "sqlglot==30.31.0",
]

[project.scripts]
agentic-ems-mcp = "agentic_ems.mcp_server:main"

[dependency-groups]
dev = ["httpx2==2.16.0", "pytest==9.2.0", "ruff", "mypy"]

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # langsmith, a dependency of langchain-core, calls a function Python 3.14 deprecates.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:langsmith",
]
