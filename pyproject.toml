[project]
name = "agentic-ems"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["duckdb==2.0.0"]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff", "mypy"]

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
