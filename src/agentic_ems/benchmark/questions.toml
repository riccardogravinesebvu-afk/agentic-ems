# H10 = draft H10. Welding line 1 runs 14:00 to 22:00 and Painting line 2 08:00 to 16:00 on
# weekdays, so the two overlap two hours a day; each line's load ramps and dips at order
# changeovers, so their peaks do not fall in the same interval and the coincident peak is
# below the sum of the separate peaks.
[[question]]
id = "H10"
group = "hierarchy"
ask = "Welding line 1 and Painting line 2 run off the same transformer. What was the highest load the two of them pulled together in the week of 9 March 2026?"
keys = []
source = "public standard"
mistake = "Each line's own peak added (separate_peaks) instead of the peak of the two lines' summed load per interval."
shape_note = "Period 2026-03-09 to 2026-03-16."

