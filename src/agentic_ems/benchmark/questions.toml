mistake = "Week is not a grain; weeks start on Monday in local time, not on the first day of the year or on Sunday."
shape_note = "Six rows, bucket_start = local midnight of each Monday (2025-12-08 to 2026-01-12) with its UTC offset, value = site kWh of that week; period 2025-12-08 to 2026-01-19."

