mistake = "Draft C6. The night shift (22:00 to 06:00) runs orders across midnight, so each order's units are split between two days by their share of its duration, not given to the day it started; Sunday 22 February has no units, so its row is null, not zero."
shape_note = "Period 2026-02-16 to 2026-02-23, seven daily rows."

