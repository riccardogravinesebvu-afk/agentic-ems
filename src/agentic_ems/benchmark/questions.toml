# The benchmark questions. Each one is written to read like a question plant staff type;
# they are not logs of real users. Question types come from a draft list of question types
# the owner read on 2026-11-11 (see docs/review-log.md); the error-class table, with the ids
# below, is in docs/golden.md.
# The wording was then revised after a second reader's review the same day.
#
# Fields: id, group, ask (the only text the model sees, before the fixed shape line),
# keys (key columns of the expected answer), source, mistake (what the question tests),
# and an optional shape_note for the people writing the reference answer; the model never
# sees shape_note or mistake.
#
# Ids are contiguous within each group except O12, rejected after review and not reused.
# Each question carries a comment with its draft id.
# The draft's H21 is rejected (at the end); its H22 is H21; its C4, C5, C6, C9, C11, C12
# are M1 to M6; its C7, C8, C10, C13 are C4 to C7.

