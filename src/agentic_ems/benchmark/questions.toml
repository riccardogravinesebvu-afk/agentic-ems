# ---------------------------------------------------------------- rejected

# draft H21, rejected after the second reader's review on 2026-11-11
[[rejected]]
id = "draft H21"
group = "unanswerable"
reason = "The sum is plain arithmetic on two quantities that are both in the data, so a refusal as the only correct outcome is disputable; the error class is already covered by O1 and O3."
ask = "If I add the solar array's production on top of the plant's consumption for April 2026, what total do I get?"
keys = []
source = "public standard"
mistake = "A sum of unlike quantities, generation added to consumption; it is not consumption net of solar."

# O12 = draft O12, rejected by the controller after the second reader's review of the
# reference queries on 2026-11-11. Its id is not reused.
[[rejected]]
id = "O12"
group = "out_of_scope"
reason = "A second defensible reading (both Painting lines' kWh whenever a Hood order runs on either line) differs from the reference by about a third, and the question is constructed rather than one plant staff would ask."
ask = "Energy per hood in March 2026, counting only the paint lines' energy while hood orders were running?"
keys = []
source = "public standard"
mistake = "Product is not a dimension; kWh must be matched to the intervals of that product's orders."
