# Painting lines' kWh in intervals covered by a Hood order, over the Hood units spread over
# those intervals, both cut to March 2026 local dates.
[O12]
sql = """
SELECT sum(r.kwh) / sum(o.units / (epoch(o.end_utc - o.start_utc) / 900)) AS value
FROM reading r
JOIN production_order o
  ON o.line_id = r.meter_id AND r.ts_utc >= o.start_utc AND r.ts_utc < o.end_utc
WHERE o.product = 'Hood'
  AND r.meter_id IN ('line_c1', 'line_c2')
  AND r.local_date >= DATE '2026-03-01' AND r.local_date < DATE '2026-04-01'
"""

