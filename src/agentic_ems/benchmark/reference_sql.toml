    AND local_date >= DATE '2026-04-01' AND local_date < DATE '2026-05-01'
  GROUP BY local_date
)
"""

# Weeks run Monday to Sunday in local dates; bucket_start is day_start of each week's
# Monday, which is the day_start of the week's earliest reading.
[O14]
sql = """
SELECT arg_min(day_start, ts_utc) AS bucket_start, sum(kwh) AS value
FROM reading
WHERE meter_id = 'site'
  AND local_date >= DATE '2025-12-08' AND local_date < DATE '2026-01-19'
GROUP BY local_date - CAST(isodow(local_date) - 1 AS INTEGER)
ORDER BY min(ts_utc)
"""
