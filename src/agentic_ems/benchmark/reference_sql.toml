# ---------------------------------------------------------------- metric definition
# Energy per unit (R5, R6): the line's own kWh over its units, each order's units spread
# evenly over its 15-minute intervals; intervals with no order keep their kWh and add no
# units; a cell with no units is NULL.

[M1]
sql = """
SELECT sum(r.kwh) / NULLIF(sum(o.units / (epoch(o.end_utc - o.start_utc) / 900)), 0) AS value
FROM reading r
LEFT JOIN production_order o
  ON o.line_id = r.meter_id AND r.ts_utc >= o.start_utc AND r.ts_utc < o.end_utc
WHERE r.meter_id = 'line_b1'
  AND r.local_date >= DATE '2026-10-01' AND r.local_date < DATE '2026-11-01'
"""

