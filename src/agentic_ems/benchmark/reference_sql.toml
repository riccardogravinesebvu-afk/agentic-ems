# [ID]            sql: the reference query, returning the question's key columns
#                 (meter_id, bucket_start, tariff_band, in that order) and then value.
# [ID.request]    the MetricRequest a correct semantic-layer agent would send
#                 (hierarchy, control and metric-definition questions only).
# [[ID.wrong]]    known wrong answers (hierarchy questions only): the complete row set a
#                 mistaken aggregation returns, with category double_count, children_sum,
#                 separate_peaks or extra_rows.
# Unanswerable questions have no entry. Periods are half-open on local dates (R10).

